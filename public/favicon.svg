<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The period, alone, on nothing. It is the series' only pink and the one shape that survives a
       16px tab; the letter and the ground both went, so the dot has to carry the mark by itself.
       81% of the box: at 94% the edge anti-aliases into the tab and it reads as a blob, not a dot. -->
  <circle cx="16" cy="16" r="13" fill="#ff2fa6"/>
</svg>
