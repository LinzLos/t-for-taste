# Netlify serves the site at the root of its own domain, so the base path is "/" here — unlike the
# GitHub Pages build, which lives under /t-for-taste/. Everything else is the same build.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_BASE = "/"
  NODE_VERSION = "22"

# The app uses a HashRouter, so every route is served from "/". This catch-all is insurance for
# anyone who lands on a deep path, and it keeps a refresh from 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Same-origin getUserMedia is allowed by default; this states the policy rather than enabling it, and
# it keeps the mic working if the site is ever framed or moved behind another origin.
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "microphone=(self)"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Defence in depth: the site has no backend, no user content and no third-party scripts, so this
    # is here to contain a compromised dependency rather than to close a hole. Three choices are not
    # obvious. `frame-ancestors *` is deliberate — episodes are meant to be embeddable, and the
    # microphone stays gated by Permissions-Policy and the browser's own prompt either way.
    # `style-src 'unsafe-inline'` is required because motion and React write inline style attributes
    # on every animated frame. `font-src data:` is required because one bundled face inlines as a
    # data URI. Scripts stay locked to 'self', which is the directive that actually matters here:
    # the built HTML carries no inline script, no inline style block and no on* attributes.
    Content-Security-Policy = "default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; frame-ancestors *; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self'"

# The portfolio reads this manifest from another origin to name the newest episode on its card.
[[headers]]
  for = "/episodes.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"
