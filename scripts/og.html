<!doctype html><html><head><meta charset="utf-8">
<!-- The social card, built from the site's own faces and tokens so it cannot drift from the site.
     Same recipe as scripts/poster.html:
       npm run build, serve dist with this file copied in, then
       chrome --headless=new --window-size=1200,630 --force-device-scale-factor=2 --hide-scrollbars \
         --screenshot=og.png --virtual-time-budget=9000 'http://localhost:5243/scripts/og.html?lede=...'
       sips -Z 1200 og.png --out public/og.png                                                     -->
<style>
  html,body{margin:0;background:#efe9dd}
  .og{width:1200px;height:630px;box-sizing:border-box;padding:96px 80px 72px;background:#efe9dd;
    display:flex;flex-direction:column;position:relative;overflow:hidden}
  .mark{font-family:"Bevan",Georgia,serif;font-weight:400;font-size:120px;line-height:.92;
    text-transform:lowercase;letter-spacing:-.02em;margin:0;
    color:#efe9dd;-webkit-text-stroke:3px #141210;paint-order:stroke fill;
    text-shadow:7px 7px 0 #141210}
  .mark i{display:inline-block;width:.17em;height:.17em;margin-left:.075em;border-radius:50%;
    background:#ff2fa6;transform:translateY(7px)}
  .lede{font-family:"Courier Prime",monospace;font-size:27px;line-height:1.5;color:#141210;
    margin:52px 0 0;max-width:520px}
  .foot{font-family:"Courier Prime",monospace;font-size:21px;color:#67645e;margin:auto 0 0;letter-spacing:.04em}
</style></head><body>
<div class="og">
  <p class="mark">t for<br>taste<i></i></p>
  <p class="lede" id="lede"></p>
  <p class="foot" id="foot"></p>
</div>
<script>
  const q = new URLSearchParams(location.search)
  document.getElementById('lede').textContent =
    q.get('lede') || 'Playful React and TypeScript builds about how AI product should feel.'
  const f = document.createElement('iframe')
  f.src = '/index.html#/'; f.style.cssText = 'position:fixed;left:-4000px;width:1000px;height:700px'
  f.onload = () => {
    // Borrow the app's stylesheets so the card is set in the real faces, and read the newest live
    // episode from the same manifest the portfolio card uses.
    f.contentDocument.head.querySelectorAll('link[rel=stylesheet],style')
      .forEach(n => document.head.appendChild(n.cloneNode(true)))
  }
  document.body.appendChild(f)
  fetch('/episodes.json').then(r => r.json()).then(d => {
    const [top] = [...(d.episodes ?? [])].sort((a, b) => b.number - a.number)
    document.getElementById('foot').textContent = top ? `t no. ${top.number}  ·  ${top.title}` : ''
  }).catch(() => {})
</script></body></html>
